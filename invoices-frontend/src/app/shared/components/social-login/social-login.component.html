<div class="social-login" *ngIf="googleConfigured || facebookConfigured || appleConfigured">
  <div class="divider"><span>or continue with</span></div>

  <div class="social-buttons">
    <!-- Google renders its own branded button into this div -->
    <div #googleBtn class="google-btn-slot" *ngIf="googleConfigured && !googleInitFailed()"></div>
    <button *ngIf="googleConfigured && googleInitFailed()" type="button" class="btn btn-ghost btn-block social-btn" (click)="retryGoogle()">
      <span class="social-icon">G</span> Retry Google Sign-in
    </button>

    <button type="button" class="btn btn-ghost btn-block social-btn" *ngIf="facebookConfigured" [disabled]="loadingProvider() === 'facebook'" (click)="continueWithFacebook()">
      <span class="social-icon">f</span>
      {{ loadingProvider() === 'facebook' ? 'Connecting...' : 'Continue with Facebook' }}
    </button>

    <button type="button" class="btn btn-ghost btn-block social-btn" *ngIf="appleConfigured" [disabled]="loadingProvider() === 'apple'" (click)="continueWithApple()">
      <span class="social-icon"></span>
      {{ loadingProvider() === 'apple' ? 'Connecting...' : 'Continue with Apple' }}
    </button>
  </div>
</div>
