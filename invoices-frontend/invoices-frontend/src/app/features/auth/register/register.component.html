<div class="auth-card fade-in">
  <h2>Create your workspace</h2>
  <p class="text-dim">Set up your account and business profile to start invoicing in minutes.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-24">
    <div class="field-row">
      <div class="field">
        <label>Full Name</label>
        <input formControlName="fullName" placeholder="Atharva Sharma" />
      </div>
      <div class="field">
        <label>Username</label>
        <input formControlName="username" placeholder="atharva" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@business.com" />
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input formControlName="phoneNumber" placeholder="+91 98765 43210" />
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      <span class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">Password must be at least 6 characters</span>
    </div>

    <hr class="divider" />

    <div class="field-row">
      <div class="field">
        <label>Business Name</label>
        <input formControlName="businessName" placeholder="Acme Studio" />
      </div>
      <div class="field">
        <label>Business Email</label>
        <input type="email" formControlName="businessEmail" placeholder="billing@acmestudio.com" />
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  <app-social-login></app-social-login>

  <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
</div>
